<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcul Parclose par Vitre</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #e3f2fd; padding: 15px; margin: 0; }
.container { background: white; padding: 20px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
h1 { color: #1976d2; text-align: center; font-size: 22px; margin: 0 0 20px 0; }
label { font-weight: bold; margin-top: 12px; display: block; font-size: 15px; }
input { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
button { width: 100%; padding: 15px; background: #1976d2; color: white; border: none; border-radius: 8px; font-size: 18px; margin-top: 10px; font-weight: bold; cursor: pointer; }
.resultat { margin-top: 20px; padding: 18px; background: #e3f2fd; border-radius: 8px; border-left: 5px solid #1976d2; display: none; }
.item { margin-bottom: 18px; }
.titre { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #1976d2; text-align: center; }
.detail { font-size: 14px; color: #444; margin: 4px 0 4px 15px; line-height: 1.5; }
.total-barres { font-size: 19px; font-weight: bold; color: #1976d2; margin-top: 8px; background: white; padding: 8px; border-radius: 6px; text-align: center; }
.formule { font-size: 13px; color: #1976d2; background: white; padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
<h1>🔩 Calcul Parclose par Vitre</h1>

<label>Hauteur de la vitre (cm)</label>
<input type="number" id="hVitre" placeholder="Ex: 54">

<label>Largeur de la vitre (cm)</label>
<input type="number" id="lVitre" placeholder="Ex: 55">

<label>Quantité de vitres</label>
<input type="number" id="quantite" value="1" min="1">

<button onclick="calculer()">CALCULER PARCLOSE</button>

<div class="resultat" id="resultat">
<div class="titre">RÉSULTAT POUR <span id="qteAff">1</span> VITRE(S)</div>

<div class="item">
<b>📏 DÉTAIL CALCUL :</b><br>
<div class="detail">Total chantier = <span id="cmTotal">0</span>cm</div>
<div class="detail">Calcul brut: <span id="brut">0</span> barre</div>
<div class="formule">Formule: (H + 1 + L) x 2 x Qté</div>
</div>

<div class="item">
<b>📦 RÉSULTAT BARRES 580cm :</b><br>
<div class="total-barres"><span id="nbParclose">0</span></div>
</div>

<div class="item" style="font-size:14px; color:#666;">
<b>Chute:</b> <span id="chuteParclose">0</span>cm
</div>
</div>
</div>

<script>
function calculer() {
let H_cm = parseFloat(document.getElementById('hVitre').value);
let L_cm = parseFloat(document.getElementById('lVitre').value);
let qte = parseFloat(document.getElementById('quantite').value);
const BARRE = 580; // 580cm

if(isNaN(H_cm) || isNaN(L_cm) || isNaN(qte) || H_cm <= 0 || L_cm <= 0 || qte <= 0) {
alert("Veuillez remplir tous les champs avec des valeurs > 0");
return;
}

// FORMULE
let unCote_cm = H_cm + 1 + L_cm;
let uneVitre_cm = unCote_cm * 2;
let cmTotal = uneVitre_cm * qte;

// TA RÈGLE : arrondi au 0.5 supérieur
let brut = cmTotal / BARRE;
let resParclose = arrondirBarres(brut, cmTotal, BARRE);

// Affichage
document.getElementById('qteAff').innerText = qte;
document.getElementById('cmTotal').innerText = cmTotal.toFixed(0);
document.getElementById('brut').innerText = brut.toFixed(2);
document.getElementById('nbParclose').innerText = resParclose.texte;
document.getElementById('chuteParclose').innerText = resParclose.chute.toFixed(0);
document.getElementById('resultat').style.display = 'block';
}

function arrondirBarres(brut, totalCM, barre) {
// Arrondi au 0.5 supérieur
let nbBarres = Math.ceil(brut * 2) / 2;

let texte;
if(nbBarres % 1 === 0.5) {
texte = Math.floor(nbBarres) + " barre + 1 demi = " + nbBarres + " barre(s)";
} else {
texte = nbBarres + " barre(s)";
}

let utilise = nbBarres * barre;
let chute = utilise - totalCM;

return {texte: texte, chute: chute};
}
</script>
</body>
</html>
